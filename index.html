<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レシート抜粋・税率計算機</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ブラウザ内OCRライブラリ（Tesseract.js） -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    @media print { .no-print { display: none; } }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-6 px-3">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
    <!-- ヘッダー -->
    <div class="bg-indigo-600 text-white p-4 flex justify-between items-center">
      <div>
        <h1 class="font-bold text-lg leading-tight">レシート抜粋計算機</h1>
        <p class="text-xs text-indigo-200">食品8%・日用品10%を分けて自動合算</p>
      </div>
      <button onclick="clearAll()" class="text-xs bg-indigo-700 hover:bg-indigo-800 text-white px-2.5 py-1.5 rounded-lg border border-indigo-400 font-medium transition">
        全クリア
      </button>
    </div>

    <div class="p-4 space-y-4">
      <!-- 合計表示カード -->
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 shadow-inner">
        <div class="flex justify-between items-baseline mb-2">
          <span class="text-sm font-bold text-slate-600">抜粋合計（税込）</span>
          <span id="grand-total" class="text-3xl font-extrabold text-indigo-600">¥0</span>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200 text-xs">
          <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-2 text-emerald-800">
            <div class="font-bold">軽減 8%（食品）</div>
            <div>税抜: <span id="subtotal-8">¥0</span></div>
            <div>内消費税: <span id="tax-8">¥0</span></div>
          </div>
          <div class="bg-sky-50 border border-sky-200 rounded-lg p-2 text-sky-800">
            <div class="font-bold">標準 10%（日用品）</div>
            <div>税抜: <span id="subtotal-10">¥0</span></div>
            <div>内消費税: <span id="tax-10">¥0</span></div>
          </div>
        </div>
      </div>

      <!-- スマホ読み取り（カメラ / 写真） -->
      <div>
        <input type="file" id="camera-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        <button onclick="document.getElementById('camera-input').click()" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold py-3 rounded-xl shadow-md text-sm transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          📷 レシートを撮影 / 写真を選ぶ
        </button>

        <!-- 読み取り中インジケーター -->
        <div id="ocr-status-box" class="hidden mt-3 p-3 bg-indigo-50 border border-indigo-200 rounded-xl text-center space-y-2">
          <div class="text-xs font-bold text-indigo-700" id="ocr-status-text">文字を解析しています... (0%)</div>
          <div class="w-full bg-indigo-200 rounded-full h-2 overflow-hidden">
            <div id="ocr-progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-200" style="width: 0%"></div>
          </div>
          <p class="text-[11px] text-slate-500">※初回のみ辞書データのダウンロードに数秒かかります</p>
        </div>
      </div>

      <!-- 操作ボタン -->
      <div class="flex gap-2">
        <button onclick="addNewItem()" class="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-300 font-bold py-2 rounded-xl text-sm transition">
          ＋ 手動で品目を追加
        </button>
        <button onclick="copySummary()" class="bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 px-3 rounded-xl text-sm transition">
          内訳をコピー
        </button>
      </div>

      <!-- テキスト一括貼付トグル -->
      <details class="text-xs bg-slate-50 border border-slate-200 rounded-xl p-3">
        <summary class="font-bold text-slate-700 cursor-pointer">読み取ったテキストを確認・直接編集</summary>
        <div class="mt-2 space-y-2">
          <p class="text-slate-500">写真読み取りのテキストがここに表示されます。直接貼り付けて反映させることも可能です。</p>
          <textarea id="ocr-input" rows="4" class="w-full border rounded-lg p-2 text-xs font-mono" placeholder="例:&#10;◎アサヒ 十六茶 2L 139&#10;ティッシュペーパー 398"></textarea>
          <button onclick="parseReceiptText(document.getElementById('ocr-input').value)" class="w-full bg-indigo-600 text-white font-bold py-1.5 rounded-lg text-xs">
            リストに反映する
          </button>
        </div>
      </details>

      <!-- リスト一覧 -->
      <div id="items-list" class="space-y-2"></div>
    </div>
  </div>

  <script>
    let items = [];

    function render() {
      const container = document.getElementById("items-list");
      container.innerHTML = "";

      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-xs border border-dashed border-slate-300 rounded-xl">
            品目がありません。<br>「📷 レシートを撮影」または「＋ 手動で追加」してください。
          </div>
        `;
        calculate();
        return;
      }

      items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = `flex items-center gap-2 p-2.5 rounded-xl border transition ${
          item.checked ? "bg-white border-slate-200" : "bg-slate-100 border-slate-200 opacity-50"
        }`;

        row.innerHTML = `
          <input type="checkbox" ${item.checked ? "checked" : ""} onchange="toggleCheck(${index})" class="w-5 h-5 accent-indigo-600 rounded cursor-pointer">
          <input type="text" value="${item.name}" oninput="updateName(${index}, this.value)" class="flex-1 min-w-0 bg-transparent text-sm border-b border-transparent focus:border-indigo-400 focus:outline-none ${!item.checked ? 'line-through text-slate-400' : 'text-slate-800 font-medium'}" placeholder="品名">
          <div class="flex items-center gap-1">
            <span class="text-xs text-slate-400">¥</span>
            <input type="number" value="${item.price || ''}" oninput="updatePrice(${index}, this.value)" class="w-16 text-right bg-transparent text-sm font-bold border-b border-transparent focus:border-indigo-400 focus:outline-none ${!item.checked ? 'line-through text-slate-400' : 'text-slate-800'}" placeholder="0">
          </div>
          <button onclick="toggleRate(${index})" class="text-[11px] font-bold px-2 py-1 rounded-md border ${
            item.rate === 8 ? "bg-emerald-50 text-emerald-700 border-emerald-300" : "bg-sky-50 text-sky-700 border-sky-300"
          }">
            ${item.rate}%
          </button>
          <button onclick="deleteItem(${index})" class="text-slate-300 hover:text-rose-500 font-bold px-1 text-sm">×</button>
        `;
        container.appendChild(row);
      });

      calculate();
    }

    function calculate() {
      let subtotal8 = 0;
      let subtotal10 = 0;

      items.forEach(item => {
        if (!item.checked) return;
        const val = Number(item.price) || 0;
        if (item.rate === 8) subtotal8 += val;
        else subtotal10 += val;
      });

      const tax8 = Math.floor(subtotal8 * 0.08);
      const tax10 = Math.floor(subtotal10 * 0.10);
      const grandTotal = subtotal8 + tax8 + subtotal10 + tax10;

      document.getElementById("subtotal-8").textContent = `¥${subtotal8.toLocaleString()}`;
      document.getElementById("tax-8").textContent = `¥${tax8.toLocaleString()}`;
      document.getElementById("subtotal-10").textContent = `¥${subtotal10.toLocaleString()}`;
      document.getElementById("tax-10").textContent = `¥${tax10.toLocaleString()}`;
      document.getElementById("grand-total").textContent = `¥${grandTotal.toLocaleString()}`;
    }

    function toggleCheck(idx) { items[idx].checked = !items[idx].checked; render(); }
    function toggleRate(idx) { items[idx].rate = items[idx].rate === 8 ? 10 : 8; render(); }
    function updateName(idx, val) { items[idx].name = val; }
    function updatePrice(idx, val) { items[idx].price = Number(val) || 0; calculate(); }
    function deleteItem(idx) { items.splice(idx, 1); render(); }
    function addNewItem() {
      items.push({ id: Date.now(), name: "", price: "", rate: 8, checked: true });
      render();
    }
    function clearAll() {
      if (items.length === 0) return;
      if (confirm("入力したすべての品目を削除しますか？")) {
        items = [];
        render();
      }
    }

    // カメラ/画像読み取り処理
    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusBox = document.getElementById("ocr-status-box");
      const statusText = document.getElementById("ocr-status-text");
      const progressBar = document.getElementById("ocr-progress-bar");

      statusBox.classList.remove("hidden");
      statusText.textContent = "画像を読み込んでいます...";
      progressBar.style.width = "10%";

      try {
        const worker = await Tesseract.createWorker('jpn+eng');
        
        // 進捗ハンドラ
        worker.reinitialize = true;
        const ret = await worker.recognize(file, {}, {
          logger: m => {
            if (m.status === 'recognizing text') {
              const progress = Math.round(m.progress * 100);
              statusText.textContent = `文字を解析しています... (${progress}%)`;
              progressBar.style.width = `${progress}%`;
            }
          }
        });

        const text = ret.data.text;
        document.getElementById("ocr-input").value = text;
        parseReceiptText(text);

        await worker.terminate();
        statusBox.classList.add("hidden");
      } catch (err) {
        console.error(err);
        alert("画像の文字認識に失敗しました。明るい場所でレシートを平らにして再度撮影してください。");
        statusBox.classList.add("hidden");
      } finally {
        event.target.value = "";
      }
    }

    // 読み取ったレシートテキストの自動パース
    function parseReceiptText(text) {
      if (!text || !text.trim()) return;
      const lines = text.split("\n");
      const newItems = [];

      lines.forEach(line => {
        let trimmed = line.trim();
        if (!trimmed) return;

        // 小計・合計・消費税・お預り・お釣りなどのレシートフッター行はスキップ
        if (/合計|小計|税|対象|お預|釣|買上|レシート|登録|TEL|電話|領収/.test(trimmed)) {
          return;
        }

        // 行末または行中の金額（半角・全角数字）を抽出
        trimmed = trimmed.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
        const priceMatch = trimmed.match(/(\d[\d,]*)\s*$/);
        if (!priceMatch) return;

        const price = parseInt(priceMatch[1].replace(/,/g, ""), 10);
        let name = trimmed.substring(0, priceMatch.index).trim();

        // 8%対象マークの自動判定（◎、※、*、軽 など）
        const is8 = /[◎※*軽]/.test(name) || /茶|水|食|菓子|肉|菜|米|パン/.test(name);
        name = name.replace(/^[◎※*軽\s\d]+/, "").replace(/[@＠]/g, "").trim();

        if (name && !isNaN(price) && price > 0 && price < 1000000) {
          newItems.push({
            id: Date.now() + Math.random(),
            name: name,
            price: price,
            rate: is8 ? 8 : 10,
            checked: true
          });
        }
      });

      if (newItems.length > 0) {
        items = newItems;
        render();
      } else {
        alert("品目と金額を自動抽出できませんでした。「読み取ったテキストを確認・直接編集」をご確認ください。");
      }
    }

    function copySummary() {
      const activeItems = items.filter(i => i.checked);
      if (activeItems.length === 0) return alert("抜粋対象の品目がありません");

      let sub8 = 0, sub10 = 0;
      let text = "【レシート抜粋内訳】\n";
      activeItems.forEach(i => {
        text += `・${i.name || '品名未入力'} (${i.rate}%): ¥${i.price}\n`;
        if (i.rate === 8) sub8 += (Number(i.price) || 0);
        else sub10 += (Number(i.price) || 0);
      });
      const t8 = Math.floor(sub8 * 0.08);
      const t10 = Math.floor(sub10 * 0.10);
      text += `-----------------\n`;
      text += `8%対象: ¥${sub8.toLocaleString()} (消費税: ¥${t8.toLocaleString()})\n`;
      text += `10%対象: ¥${sub10.toLocaleString()} (消費税: ¥${t10.toLocaleString()})\n`;
      text += `総合計: ¥${(sub8 + t8 + sub10 + t10).toLocaleString()}`;

      navigator.clipboard.writeText(text).then(() => alert("内訳をクリップボードにコピーしました！"));
    }

    render();
  </script>
</body>
</html>
